<style>
/* Layout: one card at a time on a quiet ground; a slim status strip on top; the timer is invisible to the reviewer. */
:root {
  --bg: #f5f6f3; --paper: #ffffff; --ink: #1c2320; --muted: #5c6761; --line: #d8ddd7;
  --manual: #8a4b14; --manual-soft: #f6ebdf; --assist: #1f6b52; --assist-soft: #e2efe8; --warn: #9a3b2b;
  --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-quran: "Amiri", "Traditional Arabic", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --paper: #1a201d; --ink: #e5ebe7; --muted: #9ba79f; --line: #2c3430;
  --manual: #e6a76a; --manual-soft: #33261a; --assist: #6cc4a1; --assist-soft: #1c3028; --warn: #ec8f7d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --paper: #1a201d; --ink: #e5ebe7; --muted: #9ba79f; --line: #2c3430;
  --manual: #e6a76a; --manual-soft: #33261a; --assist: #6cc4a1; --assist-soft: #1c3028; --warn: #ec8f7d; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.7 var(--f-ui); direction: rtl; padding-inline: 16px; padding-block: 0 48px }
main { max-width: 640px; margin-inline: auto; display: grid; gap: 16px }
h1 { font-size: 1.3rem; margin: 18px 0 0; text-wrap: balance }
h2 { font-size: 1.05rem; margin: 0 }
p { margin: 0 }
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums }
.pill { padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: .85rem }
.pill.A { background: var(--manual-soft); color: var(--manual) }
.pill.B { background: var(--assist-soft); color: var(--assist) }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px }
.card.A { border-top: 4px solid var(--manual) }
.card.B { border-top: 4px solid var(--assist) }
.label { font-size: .8rem; color: var(--muted) }
.quote { font-family: var(--f-quran); font-size: 1.45rem; line-height: 2.1; overflow-wrap: anywhere }
.cited { font-weight: 600 }
.notice { font-size: .85rem; color: var(--warn) }
.miyar { background: var(--assist-soft); border-radius: 10px; padding: 12px; display: grid; gap: 6px }
.miyar .v { font-weight: 600; color: var(--assist) }
.miyar .t { font-family: var(--f-quran); font-size: 1.25rem; line-height: 2.05; overflow-wrap: anywhere }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px }
legend { font-size: .8rem; color: var(--muted); margin-bottom: 6px }
.opt { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer }
.opt input { width: 20px; height: 20px; flex: none }
.opt:has(input:checked) { border-color: var(--ink) }
textarea { width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; resize: vertical }
.check { display: flex; gap: 8px; align-items: center; min-height: 44px; font-size: .9rem }
button { font: inherit; font-weight: 600; min-height: 48px; border-radius: 8px; border: 0; cursor: pointer; padding-inline: 16px; background: var(--ink); color: var(--paper) }
button:disabled { opacity: .4; cursor: not-allowed }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px }
#out { font-family: ui-monospace, Menlo, monospace; font-size: .72rem; direction: ltr; min-height: 140px }
.muted { color: var(--muted); font-size: .9rem }
</style>

  if (!prev || prev.condition !== s.condition) {
    c.append(el("h2", null, `كتلة جديدة: ${COND[s.condition]}`));
    c.append(el("p", "muted", s.condition === "A" ? "تحقق يدوياً بالمصحف. لا تفتح مِعيار." : "ستظهر أدلة مِعيار مع كل عنصر."));
  }
  if (s.warmup) c.append(el("p", "muted", "عنصر إحماء (لا يدخل في الحساب)، لكن عامله كغيره."));
  const b = el("button", null, "ابدأ العنصر");
  b.addEventListener("click", () => { st.current = { i, started_at_ms: Date.now() }; save(); render(); });
  c.append(b); screen.append(c);
}

function item(i) {
  const s = DATA.sequence[i]; strip(i); screen.textContent = "";
  const c = el("section", "card " + s.condition);
  c.append(el("p", "notice", DATA.notice));
  c.append(el("p", "label", "المقطع كما ورد"), el("p", "quote", s.quote));
  c.append(el("p", "label", "الموضع كما كُتب"), el("p", "cited", s.cited_as_written));
  if (s.miyar) {
    const m = el("div", "miyar");
    m.append(el("p", "v", `حكم مِعيار: ${s.miyar.status}`), el("p", null, `السبب: ${s.miyar.reason}`));
    if (s.miyar.matched_text) m.append(el("p", "label", `نص البيانات ${s.miyar.matched_ref ? "(" + s.miyar.matched_ref + ")" : ""}`), el("p", "t", s.miyar.matched_text));
    if (s.miyar.suggestion && s.miyar.suggestion.text && !s.miyar.matched_text)
      m.append(el("p", "label", `أقرب آية في البيانات (${s.miyar.suggestion.ref})`), el("p", "t", s.miyar.suggestion.text));
    c.append(m);
  }
  const fs = el("fieldset"); fs.append(el("legend", null, "حكمك"));
  let chosen = null;
  const btn = el("button", null, "احفظ الحكم"); btn.disabled = true;
  for (const [v, label] of DATA.verdicts) {
    const l = el("label", "opt"); const r = document.createElement("input");
    r.type = "radio"; r.name = "v"; r.value = v; r.id = `v-${i}-${v}`;
    r.addEventListener("change", () => { chosen = v; btn.disabled = false; });
    l.append(r, el("span", null, label)); fs.append(l);
  }
  const notes = document.createElement("textarea"); notes.id = `n-${i}`; notes.placeholder = "ملاحظات (اختياري)"; notes.setAttribute("aria-label", "ملاحظات");
  const ck = el("label", "check"); const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = `int-${i}`;
  ck.append(cb, el("span", null, "حدث انقطاع أثناء هذا العنصر"));
  btn.addEventListener("click", () => {
    const end = Date.now(), cur = st.current;
    st.done.push({ position: s.position, item_id: s.item_id, condition: s.condition, block: s.block, warmup: s.warmup,
      started_at_ms: cur.started_at_ms, submitted_at_ms: end, duration_ms: end - cur.started_at_ms,
      started_at: riyadh(cur.started_at_ms), submitted_at: riyadh(end),
      human_verdict: chosen, notes: notes.value, interrupted: cb.checked || !!cur.reloaded });
    st.current = null; save(); render();
  });
  c.append(fs, notes, ck, btn); screen.append(c);
}

function finish() {
  strip(DATA.sequence.length); screen.textContent = "";
  const c = el("section", "card");
  c.append(el("h2", null, "انتهت الجلسة"), el("p", "muted", "انسخ البيانات الخام وألصقها في المحادثة كما هي، دون تعديل."));
  const out = document.createElement("textarea"); out.id = "out"; out.readOnly = true; out.setAttribute("aria-label", "البيانات الخام");
  out.value = JSON.stringify({ tool_version: DATA.tool_version, reviewer: DATA.reviewer, reviewer_info: DATA.reviewer_info,
    assignment_sha256: DATA.assignment_sha256, payload_sha256: PAYLOAD_SHA, attestation: st.attestation,
    user_agent: navigator.userAgent, records: st.done });
  const msg = el("p", "muted");
  const b = el("button", null, "انسخ البيانات الخام");
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(out.value); msg.textContent = "نُسخت. ألصقها في المحادثة."; }
    catch { out.focus(); out.select(); msg.textContent = "حُدد النص. انسخه يدوياً."; }
  });
  c.append(b, msg, out); screen.append(c);
}

function render() {
  const i = st.done.length;
  if (!st.started) return intro();
  if (i >= DATA.sequence.length) return finish();
  if (st.current && st.current.i === i) return item(i);
  return waiting(i);
}
if (st.current) { st.current.reloaded = true; save(); }
hashPayload().catch(() => {}).finally(render);
</script>
